name: Cloud stream (Linux editors)

# Builds the Linux engines of cloud editing (editors/cloud-stream/README.md): CutDeck
# (editors/cut: filmcraft + filmcraft-cli) and CutEffect (editors/motion: effectcraft +
# effectcraft-cli) on Debian bookworm, the system the stream image runs, and keeps them as a
# workflow artifact (cloud-stream-engines-<arch>, 7 days). With push_image, also builds the stream
# image from them (editors/cloud-stream/Dockerfile, ENGINES=prebuilt) and pushes it to GHCR —
# private packages count against the account's package storage, so it is off by default.
#
# Runs unchanged here or in moustaphamoussa-dev/cutaround-releases (public: free minutes and
# arm64 runners; Actions has never started on the private glisse repo), where
# secrets.GLISSE_SOURCE_TOKEN reads Kakaymi10/glisse.
#
# Locally: download the artifact into editors/cloud-stream/bin/ and
#   docker build -f editors/cloud-stream/Dockerfile --build-arg ENGINES=prebuilt -t cutaround-stream .

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "glisse branch, tag or commit to build"
        type: string
        default: main
      arch:
        description: "Architectures (arm64: for Apple Silicon Docker tests)"
        type: choice
        options: [x64, arm64, both]
        default: x64
      smoke:
        description: "Run the stream image on the runner and drive it from headless Chrome (screenshots artifact)"
        type: boolean
        default: true
      push_image:
        description: "Also build and push ghcr.io/<owner>/cutaround-stream (cpu + nvidia tags, x64)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-stream-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.m.outputs.archs }}
    steps:
      - id: m
        run: |
          case "${{ inputs.arch }}" in
            x64) echo 'archs=["x64"]' >> "$GITHUB_OUTPUT" ;;
            arm64) echo 'archs=["arm64"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'archs=["x64","arm64"]' >> "$GITHUB_OUTPUT" ;;
          esac

  engines:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.plan.outputs.archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # bookworm's glibc (2.36): the binaries then run on the neko base image and any newer Debian
    container: rust:1.95-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kakaymi10/glisse
          token: ${{ secrets.GLISSE_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            editors/cut
            editors/motion
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libasound2-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            editors/cut
            editors/motion
          key: cloud-stream-${{ matrix.arch }}
      - name: CutDeck
        working-directory: editors/cut
        run: cargo build --release -p filmcraft -p filmcraft-cli
      - name: CutEffect
        working-directory: editors/motion
        run: cargo build --release -p effectcraft -p effectcraft-cli
      - name: Collect
        run: |
          mkdir -p out
          cp editors/cut/target/release/filmcraft editors/cut/target/release/filmcraft-cli out/
          cp editors/motion/target/release/effectcraft editors/motion/target/release/effectcraft-cli out/
          strip out/* || true
          ls -la out
          ./out/filmcraft-cli --version || true
          ./out/effectcraft-cli --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-stream-engines-${{ matrix.arch }}
          path: out/
          retention-days: 7

  # The image on the runner (Mesa, no GPU), the editor streamed into headless Chromium: the page
  # signs in, the window plays as video, a click and keys reach it, the agent saves. Screenshots
  # and container logs are the artifact cloud-stream-smoke-<arch>.
  smoke:
    needs: [plan, engines]
    if: ${{ inputs.smoke }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.plan.outputs.archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kakaymi10/glisse
          token: ${{ secrets.GLISSE_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            editors/cloud-stream
            editors/cloud-runner
      - uses: actions/download-artifact@v4
        with:
          name: cloud-stream-engines-${{ matrix.arch }}
          path: editors/cloud-stream/bin
      - name: Build the image (prebuilt engines)
        run: docker build -f editors/cloud-stream/Dockerfile --build-arg ENGINES=prebuilt -t cutaround-stream .
      - name: Start a session (CutDeck, new project)
        run: |
          docker run -d --name stream --shm-size=1g -p 8080:8080 -p 8091:8091 \
            -p 59000:59000/udp -p 59000:59000/tcp \
            -e STREAM_PASSWORD=dev -e STREAM_TOKEN=dev -e STREAM_EDITOR=cutdeck \
            -e STREAM_PUBLIC_IP=127.0.0.1 -e STREAM_SCREEN=1600x900@30 cutaround-stream
          for _ in $(seq 1 120); do
            h=$(curl -s http://127.0.0.1:8091/health || true); echo "$h"
            case "$h" in *'"ready": true'*) exit 0 ;; *'"error": "'*) exit 1 ;; esac
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drive it from a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/editors/cloud-stream/smoke.mjs" /tmp/pw/smoke.mjs
          node /tmp/pw/smoke.mjs http://127.0.0.1:8080 http://127.0.0.1:8091 "$GITHUB_WORKSPACE/shots"
      - name: Container logs
        if: always()
        run: |
          mkdir -p shots
          docker logs stream > shots/container.log 2>&1 || true
          docker exec stream sh -c 'tail -n 200 /var/log/neko/*.log' > shots/neko-logs.txt 2>&1 || true
          tail -n 60 shots/container.log; tail -n 80 shots/neko-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-stream-smoke-${{ matrix.arch }}
          path: shots/
          retention-days: 7

  image:
    needs: engines
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kakaymi10/glisse
          token: ${{ secrets.GLISSE_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: cloud-stream-engines-x64
          path: editors/cloud-stream/bin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: n
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cutaround-stream" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: editors/cloud-stream/Dockerfile
          build-args: ENGINES=prebuilt
          push: true
          tags: ${{ steps.n.outputs.repo }}:cpu
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: editors/cloud-stream/Dockerfile
          build-args: |
            ENGINES=prebuilt
            BASE_IMAGE=ghcr.io/m1k1o/neko/nvidia-base:3.2
          push: true
          tags: ${{ steps.n.outputs.repo }}:nvidia
